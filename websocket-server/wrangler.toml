name = "vendorbridge-ws"
main = "src/index.js"
compatibility_date = "2024-12-01"

[durable_objects]
bindings = [
  { name = "WS_HUB", class_name = "WebSocketHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebSocketHub"]

[vars]
# Comma-separated allowed origins for CORS.
ALLOWED_ORIGINS = "http://localhost:3000,https://qubits-vendorbridge.vercel.app"

# `WEBHOOK_SECRET` is configured as a Wrangler secret, not a plain-text var.
# Upload it once with:
#   echo "<value>" | wrangler secret put WEBHOOK_SECRET
# (Don't add it here — Cloudflare rejects same-name var + secret bindings.)
